<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steigungen trainieren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: Kopfband mit Logo rechts, Seitennavigation links (Themen V, 1–4), Inhalt rechts; auf dem Handy Navigation als Klappmenü. Mathe = dunkelblau */
:root{
  --bg:#f1f4fa; --surface:#ffffff; --fg:#141f38; --muted:#56627b; --line:#d5dcea;
  --band:#13285a; --band-fg:#ffffff; --accent:#3a6fd9; --accent-ink:#1d47a3; --accent-soft:#e3ebfb;
  --ok:#2e7d32; --ok-soft:#e5f3e6; --bad:#c62828; --bad-soft:#fbe7e7; --chip:#e6ebf5;
  --sign:#cc1f1f; --sign-in:#ffffff; --sign-ink:#141414;
  --f-head:"Bitter", Georgia, serif; --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --surface:#151e35; --fg:#e4eaf7; --muted:#a0abc3; --line:#27324f;
  --band:#0e1d45; --band-fg:#f1f5fd; --accent:#6f9cff; --accent-ink:#a8c3ff; --accent-soft:#1b2a4f;
  --ok:#7fd483; --ok-soft:#1c3320; --bad:#ff8a80; --bad-soft:#3a1e1e; --chip:#202b47;
  --sign:#e04848; --sign-in:#f4f4f4; --sign-ink:#141414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --surface:#151e35; --fg:#e4eaf7; --muted:#a0abc3; --line:#27324f;
  --band:#0e1d45; --band-fg:#f1f5fd; --accent:#6f9cff; --accent-ink:#a8c3ff; --accent-soft:#1b2a4f;
  --ok:#7fd483; --ok-soft:#1c3320; --bad:#ff8a80; --bad-soft:#3a1e1e; --chip:#202b47;
  --sign:#e04848; --sign-in:#f4f4f4; --sign-ink:#141414; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
header.top{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--f-head);font-size:1.3rem;margin:0;line-height:1.2;text-wrap:balance}
.top .sub{font-size:.8rem;opacity:.85;letter-spacing:.04em}
.top .ttl{flex:1;min-width:0}
.logo{background:#ffffff;border-radius:8px;padding:5px 9px;display:flex;align-items:center;flex-shrink:0}
.logo img{height:30px;width:auto;display:block}
.menu-btn{display:none;background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--band-fg);border-radius:6px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px 10px;font-weight:700}
.side a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--fg);text-decoration:none;font-size:.95rem}
.side a .n{font-size:.75rem;font-weight:700;min-width:30px;height:22px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-variant-numeric:tabular-nums}
.side a:hover{background:var(--chip)}
.side a.on{background:var(--band);color:var(--band-fg)}
.side a.on .n{background:var(--band-fg);color:var(--band)}
main{min-width:0}
main h2{font-family:var(--f-head);font-size:1.75rem;margin:0 0 6px;line-height:1.2;text-wrap:balance;color:var(--fg)}
main h3{font-family:var(--f-head);font-size:1.2rem;margin:0 0 10px}
.lead{color:var(--muted);max-width:68ch;margin:0 0 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-weight:600;background:none;border:none;padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.goalbox{border-left:5px solid var(--accent)}
.theory{max-width:72ch}
.theory p{margin:0 0 12px}
.theory ul,.theory ol{margin:0 0 12px;padding-left:22px}
.theory b{color:var(--accent-ink)}
.formel{font-family:var(--f-head);font-size:1.15rem;background:var(--chip);border-radius:8px;padding:10px 14px;margin:10px 0 14px;display:inline-block}
.merk{background:var(--accent-soft);border-radius:8px;padding:12px 16px;margin:14px 0}
.merk::before{content:"Merke";display:block;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:4px}
.fig{margin:10px 0 16px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto}
.fig .cap{font-size:.85rem;color:var(--muted);margin-top:4px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{stroke:var(--muted);stroke-width:1.5}
svg .ln{stroke:var(--accent-ink);stroke-width:3;fill:none}
svg .tri{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
svg .wedge{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:2}
svg .hyp{stroke:var(--accent);stroke-width:3}
svg .pt{fill:var(--accent-ink)}
svg text{fill:var(--fg);font-family:var(--f-body);font-size:14px}
svg text.s{fill:var(--muted);font-size:12px}
svg .sgn{fill:var(--sign)} svg .sgi{fill:var(--sign-in)} svg .sgk{fill:var(--sign-ink)}
svg text.sgt{fill:var(--sign-ink);font-weight:700;font-size:30px}
.tblwrap{overflow-x:auto;margin:10px 0 14px}
table.t{border-collapse:collapse;min-width:420px;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--chip)}
.lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lv span{font-size:.85rem;background:var(--chip);border-radius:6px;padding:3px 9px}
.lvh{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.goal{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.goal input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent-ink);flex-shrink:0}
.goal .txt{flex:1;min-width:0}
.goal .meta{font-size:.8rem;color:var(--muted)}
.goal a.go{font-size:.85rem;font-weight:600;color:var(--accent-ink);text-decoration:none;white-space:nowrap;padding:4px 9px;border-radius:6px;background:var(--accent-soft)}
.goals{display:flex;flex-direction:column;gap:8px}
.stars{color:var(--accent-ink);font-weight:700;letter-spacing:1px}
.prog{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.prog div{height:100%;background:var(--accent);width:0;transition:width .3s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.q .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--muted)}
.tag.b{background:var(--accent-soft);color:var(--accent-ink)}
.q .qt{font-weight:600;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.numrow{display:flex;gap:8px;align-items:center}
.numrow input{font:inherit;width:9em;max-width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.numrow input.ok{border-color:var(--ok);background:var(--ok-soft)}
.numrow input.bad{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;align-items:center}
.match select{font:inherit;font-size:.95rem;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.match select.ok{border-color:var(--ok);background:var(--ok-soft)}
.match select.bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{font:inherit;font-weight:600;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;background:var(--band);color:var(--band-fg)}
.btn.sec{background:var(--chip);color:var(--fg)}
.btn:focus-visible,.side a:focus-visible,.tabs button:focus-visible,.goal a.go:focus-visible,.numrow input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{margin-top:10px;padding:9px 12px;border-radius:7px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);color:var(--fg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--fg);border-left:4px solid var(--bad)}
.write textarea{width:100%;min-height:90px;font:inherit;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.sol{margin-top:10px;background:var(--accent-soft);border-radius:8px;padding:10px 14px}
.score{font-family:var(--f-head);font-size:2.2rem;font-variant-numeric:tabular-nums}
.foot{font-size:.82rem;color:var(--muted);margin-top:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--accent)}
.card .n{font-size:.8rem;color:var(--accent-ink);font-weight:700}
.card b{font-family:var(--f-head)}
.card .m{font-size:.82rem;color:var(--muted)}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  .menu-btn{display:inline-block}
  nav.side{position:static;display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
  nav.side.open{display:flex}
  .top h1{font-size:1.05rem}
  .logo img{height:24px}
  .match{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- Grafiken ---------- */
function ks(o){
  const u=34,p=26,{xmin,xmax,ymin,ymax}=o;
  const X=x=>p+(x-xmin)*u, Y=y=>p+(ymax-y)*u, W=X(xmax)+p, H=Y(ymin)+p;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="'+o.label+'">';
  for(let x=xmin;x<=xmax;x++)s+='<line class="grid" x1="'+X(x)+'" y1="'+Y(ymin)+'" x2="'+X(x)+'" y2="'+Y(ymax)+'"/>';
  for(let y=ymin;y<=ymax;y++)s+='<line class="grid" x1="'+X(xmin)+'" y1="'+Y(y)+'" x2="'+X(xmax)+'" y2="'+Y(y)+'"/>';
  s+='<line class="ax" x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'"/><line class="ax" x1="'+X(0)+'" y1="'+Y(ymin)+'" x2="'+X(0)+'" y2="'+Y(ymax)+'"/>';
  s+='<text x="'+(X(xmax)-4)+'" y="'+(Y(0)-6)+'" text-anchor="end">x</text><text x="'+(X(0)+6)+'" y="'+(Y(ymax)+12)+'">y</text>';
  for(let x=xmin;x<xmax;x++)if(x)s+='<text class="s" x="'+X(x)+'" y="'+(Y(0)+15)+'" text-anchor="middle">'+String(x).replace('-','−')+'</text>';
  for(let y=ymin;y<ymax;y++)if(y)s+='<text class="s" x="'+(X(0)-6)+'" y="'+(Y(y)+4)+'" text-anchor="end">'+String(y).replace('-','−')+'</text>';
  const [m,q]=o.line,[x0,dx]=o.tri,y0=m*x0+q,y1=y0+m*dx;
  s+='<polygon class="tri" points="'+X(x0)+','+Y(y0)+' '+X(x0+dx)+','+Y(y0)+' '+X(x0+dx)+','+Y(y1)+'"/>';
  s+='<line class="ln" x1="'+X(xmin)+'" y1="'+Y(m*xmin+q)+'" x2="'+X(xmax)+'" y2="'+Y(m*xmax+q)+'"/>';
  s+='<text x="'+X(x0+dx/2)+'" y="'+(Y(y0)+(m>0?18:-8))+'" text-anchor="middle">'+dx+' nach rechts</text>';
  s+='<text x="'+(X(x0+dx)+6)+'" y="'+(Y((y0+y1)/2)+5)+'">'+Math.abs(m*dx)+(m>0?' nach oben':' nach unten')+'</text>';
  s+='<circle class="pt" cx="'+X(0)+'" cy="'+Y(q)+'" r="5"/>';
  s+='<text x="'+(X(xmax)-6)+'" y="'+(Y(m*xmax+q)+(m>0?22:-10))+'" text-anchor="end" style="font-weight:700">'+o.eq+'</text>';
  return s+'</svg>';
}

theory:`<p>Die <b>Steigung</b> beschreibt mit einer Zahl, <b>wie steil</b> etwas ist: eine Strasse, eine Rampe, eine Treppe oder eine Skipiste. Man vergleicht dazu den <b>Höhenunterschied</b> mit der <b>horizontalen Länge</b>.</p>
<p>Die horizontale Länge misst man waagrecht, so wie auf einer Landkarte. Sie ist nicht die schräge Strecke, die man auf der Strasse geht.</p>
<div class="fig">${SIGN}<div class="cap">12 % heisst: Auf 100 m horizontaler Länge steigt die Strasse um 12 m.</div></div>
<ul><li><b>Steigung:</b> In Fahrtrichtung geht es aufwärts.</li><li><b>Gefälle:</b> In Fahrtrichtung geht es abwärts. Die Zahl ist gleich gross, im Koordinatensystem hat sie ein Minus.</li></ul>
<p><b>Durchschnittliche Steigung:</b> gesamter Höhenunterschied : gesamte horizontale Länge. <b>Maximale Steigung:</b> die Steigung des steilsten Abschnitts.</p>
<div class="tblwrap"><table class="t"><tr><th>Wanderweg</th><th>horizontale Länge</th><th>Höhenunterschied</th><th>Steigung</th></tr>

theory:`<div class="fig">${WEDGE}</div>

<div class="tblwrap"><table class="t"><tr><th>Gesucht</th><th>Rechnung</th><th>Beispiel</th></tr>
<tr><td>Steigung m</td><td>Höhe : horizontale Länge</td><td>3 m : 12 m = 0,25 = 25 %</td></tr>

<p>Beispiel Rollstuhlrampe: Sie soll 0,9 m überwinden und darf höchstens 6 % steil sein. Horizontale Länge: 0,9 m : 0,06 = <b>15 m</b>.</p>
<div class="merk">100 % heisst: Höhe und horizontale Länge sind gleich gross (Winkel 45°). Steigungen über 100 % gibt es auch, z. B. bei Leitern.</div>`,

t3:{nr:'3',title:'Steigungsdreiecke im Koordinatensystem',
lv:['Anton: Lineare Funktionen kennenlernen','TH 2 Steigung im Koordinatensystem','Schulbuch: Aufgabe 7, 8 und 9','Anton: Steigungen ermitteln','Schulbuch: Aufgabe 10','Arbeitsblatt: Steigungsdreiecke zeichnen','Film: Steigung im Koordinatensystem','Hausaufgabe 3'],
theory:`<p>Auch eine <b>Gerade</b> im Koordinatensystem hat eine Steigung. Du bestimmst sie mit einem <b>Steigungsdreieck</b>: Von einem Punkt auf der Geraden gehst du nach <b>rechts</b> und dann nach <b>oben</b> oder <b>unten</b>, bis du wieder auf der Geraden bist.</p>
<div class="fig">${ks({xmin:-1,xmax:7,ymin:-1,ymax:5,line:[0.5,1],tri:[0,4],eq:'y = 0,5x + 1',label:'Gerade mit Steigungsdreieck: 4 nach rechts, 2 nach oben'})}<div class="cap">Steigungsdreieck: 4 nach rechts, 2 nach oben → m = 2 : 4 = 0,5</div></div>
<div class="formel">m = (nach oben oder unten) : (nach rechts)</div>
<p>Mit zwei Punkten A(x₁|y₁) und B(x₂|y₂) geht es auch ohne Zeichnung: <b>m = (y₂ − y₁) : (x₂ − x₁)</b>.</p>
<ul><li><b>m positiv:</b> Die Gerade steigt (von links nach rechts).</li><li><b>m negativ:</b> Die Gerade fällt.</li><li><b>m = 0:</b> Die Gerade ist waagrecht.</li><li>Je grösser die Zahl (ohne Vorzeichen), desto steiler die Gerade.</li></ul>
<div class="merk">Wähle das Steigungsdreieck so, dass seine Ecken auf Gitterpunkten liegen. Dann kannst du genau ablesen.</div>`,
ex:[
{t:'num',b:'Anwenden',g:7,q:'Eine Gerade geht durch A(0|0) und B(4|2). Wie gross ist die Steigung m?',a:0.5,e:'2 nach oben, 4 nach rechts: 2 : 4 = 0,5'},
{t:'num',b:'Anwenden',g:7,q:'Eine Gerade geht durch A(1|3) und B(3|7). Wie gross ist die Steigung m?',a:2,e:'(7 − 3) : (3 − 1) = 4 : 2 = 2'},

{t:'match',b:'Verstehen',g:6,q:'Welche Steigung gehört zum Steigungsdreieck?',l:['3 nach rechts, 1 nach oben','2 nach rechts, 4 nach oben','1 nach rechts, 2 nach unten','4 nach rechts, 0 nach oben'],o:['m = 1/3','m = 2','m = −2','m = 0'],a:[0,1,2,3]},
{t:'mc',b:'Verstehen',g:7,q:'Welche Gerade steigt am stärksten?',o:['m = 2','m = 0,5','m = −3','m = 1'],a:0,e:'m = −3 ist zwar steil, aber diese Gerade fällt.'},
{t:'tf',b:'Verstehen',g:7,q:'Eine Gerade mit negativer Steigung fällt von links nach rechts.',a:true},
{t:'mc',b:'Analysieren',g:7,q:'Fehler finden: Tim rechnet für A(1|1) und B(5|3): «m = 4 : 2 = 2». Was ist falsch?',o:['Er hat «nach rechts» durch «nach oben» gerechnet. Richtig: m = 2 : 4 = 0,5.','Er hat die Punkte vertauscht.','Er hätte 5 : 3 rechnen müssen.','Nichts, m = 2 ist richtig.'],a:0}
],
w:[{q:'Zeichne in deinem Übungsheft ein Koordinatensystem. Zeichne die Gerade durch P(0|1) und Q(4|3) und ein Steigungsdreieck. Berechne die Steigung.',a:'Steigungsdreieck von P aus: 4 nach rechts, 2 nach oben → m = 2 : 4 = 0,5. Ein kleineres Dreieck (2 nach rechts, 1 nach oben) gibt dieselbe Steigung.'}]},

t4:{nr:'4',title:'Geraden zeichnen und Gleichungen bestimmen',
lv:['Übungsheft: Gerade durch einen Punkt zeichnen','AB 2 Steigung im Koordinatensystem','Zusatzaufgabe: Schulbuch Aufgabe 11 und 12 (S. 45)','Zusatzaufgabe: Graph – Wertetabelle – Gleichung'],
theory:`<p>Jede Gerade kann man mit einer <b>Geradengleichung</b> beschreiben:</p>
<div class="formel">y = m · x + q</div>
<ul><li><b>m</b> ist die Steigung.</li><li><b>q</b> sagt, wo die Gerade die y-Achse schneidet: im Punkt (0|q).</li><li>Ist q = 0, geht die Gerade durch den Nullpunkt (0|0): y = m · x.</li></ul>
<p><b>Gerade zeichnen</b> in 3 Schritten:</p>
<ol><li>Punkt (0|q) auf der y-Achse einzeichnen.</li><li>Steigungsdreieck anhängen. Bei m = −0,5 heisst das: 2 nach rechts, 1 nach unten.</li><li>Die Punkte mit dem Lineal verbinden und die Gerade beschriften.</li></ol>
<div class="fig">${ks({xmin:-1,xmax:7,ymin:-2,ymax:4,line:[-0.5,2],tri:[0,2],eq:'y = −0,5x + 2',label:'Gerade y gleich minus 0,5 x plus 2 mit Steigungsdreieck'})}<div class="cap">Start bei (0|2), dann 2 nach rechts, 1 nach unten.</div></div>
<p><b>Gleichung bestimmen:</b> q auf der y-Achse ablesen, m mit einem Steigungsdreieck bestimmen, beides in y = m · x + q einsetzen.</p>
<div class="merk">Parallele Geraden haben die gleiche Steigung m. Ob ein Punkt auf der Geraden liegt, prüfst du, indem du x einsetzt und y vergleichst.</div>`,

{t:'mc',b:'Wissen',g:8,q:'Wo schneidet die Gerade y = 2x − 3 die y-Achse?',o:['(0|−3)','(0|2)','(−3|0)','(2|−3)'],a:0},

],
w:[{q:'Zeichne die Gerade y = −0,5x + 2 in dein Übungsheft. Beschreibe deine drei Schritte.',a:'1. Punkt (0|2) einzeichnen. 2. Steigungsdreieck: 2 nach rechts, 1 nach unten → (2|1), dann weiter zu (4|0). 3. Punkte verbinden. Die Gerade fällt.'},

  if(x.t==='mc'){const s=el.querySelector('input:checked');if(!s)return msg(el,null);ok=+s.value===x.a;el.querySelector('input[value="'+x.a+'"]').closest('.opt').classList.add('ok');if(!ok)s.closest('.opt').classList.add('bad');}
  if(x.t==='tf'){const s=el.querySelector('input:checked');if(!s)return msg(el,null);ok=(s.value==='1')===x.a;el.querySelectorAll('.opt')[x.a?0:1].classList.add('ok');if(!ok)s.closest('.opt').classList.add('bad');}
  if(x.t==='multi'){const s=[...el.querySelectorAll('input:checked')].map(i=>+i.value);if(!s.length)return msg(el,null);ok=s.length===x.a.length&&s.every(v=>x.a.includes(v));el.querySelectorAll('.opt').forEach(o=>{const i=+o.querySelector('input').value;if(x.a.includes(i))o.classList.add('ok');else if(s.includes(i))o.classList.add('bad')});}
  if(x.t==='match'){const ss=[...el.querySelectorAll('select')];if(ss.some(s=>s.value===''))return msg(el,null);ok=true;ss.forEach((s,i)=>{const r=+s.value===x.a[i];s.classList.remove('ok','bad');s.classList.add(r?'ok':'bad');if(!r)ok=false});}
  if(x.t==='num'){const inp=el.querySelector('input');const raw=inp.value.trim().replace(/[’'\s%]/g,'').replace(/[−–]/g,'-').replace(',','.');if(raw===''||isNaN(+raw))return msg(el,null);ok=Math.abs(+raw-x.a)<=(x.tol??0.001);inp.classList.remove('ok','bad');inp.classList.add(ok?'ok':'bad');}
  msg(el,ok,x);return ok;
}
function msg(el,ok,x){
  const f=el.querySelector('.fbx');
  if(ok===null){f.innerHTML='<div class="fb bad">Gib zuerst eine Antwort ein.</div>';return null}
  let extra='';
  if(x.t==='match'&&!ok)extra=' Richtig wäre: '+x.l.map((l,i)=>esc(l)+' → '+esc(x.o[x.a[i]])).join('; ')+'.';
  if(x.t==='num'&&!ok)extra=' Richtig wäre: '+fmt(x.a)+(x.u?' '+x.u:'')+'.';
  f.innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'Richtig!':'Noch nicht ganz.')+'</b>'+extra+' '+(x.e?esc(x.e):'')+'</div>';
  return ok;
}
function viewTopic(k){
  const tp=T[k];const gs=GOALS.filter(g=>g[2]===k);
  const goalsHtml=gs.length?gs.map(([n,lv,,tx])=>'<div><span class="stars">'+lv+'</span> '+n+'. Ich kann '+esc(tx)+'</div>').join(''):'<div>'+esc(tp.pre)+'</div>';
  $('#main').innerHTML=`<h2>${k==='t0'?'':tp.nr+' '}${tp.title}</h2><p class="lead">${gs.length?'Lernziele '+gs.map(g=>g[0]).join(', '):'Grundlage für die ganze LU 14'}</p>
  <div class="box goalbox"><div class="goals">${goalsHtml}</div><div class="lvh">Dazu in LearningView</div><div class="lv">${tp.lv.map(t=>'<span>'+esc(t)+'</span>').join('')}</div></div>
  <div class="tabs" role="tablist"><button class="on" data-tab="th">Theorie</button><button data-tab="ex">Übungen (${tp.ex.length})</button><button data-tab="wr">Auftrag fürs Übungsheft</button></div>
  <section id="th" class="box theory">${tp.theory}</section>
  <section id="ex" hidden>${tp.ex.map((x,i)=>qHtml(x,k+'q'+i)).join('')}<div class="row"><a class="btn sec" href="#test" style="text-decoration:none">Zur Lernkontrolle →</a></div></section>
  <section id="wr" hidden>${tp.w.map((w,i)=>'<div class="box write"><h3>Auftrag '+(i+1)+'</h3><p>'+esc(w.q)+'</p><p style="font-size:.9rem;color:var(--muted)">Löse zuerst selbst im Übungsheft oder schreibe ins Feld. Vergleiche danach mit der Musterlösung.</p><textarea id="'+k+'w'+i+'" aria-label="Deine Antwort"></textarea><div class="row"><button class="btn sec" data-sol="'+k+'s'+i+'">Musterlösung zeigen</button></div><div class="sol" id="'+k+'s'+i+'" hidden>'+esc(w.a)+'</div></div>').join('')}</section>`;
  document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['th','ex','wr'].forEach(s=>$('#'+s).hidden=s!==b.dataset.tab)}));
  tp.ex.forEach((x,i)=>{document.querySelector('[data-chk="'+k+'q'+i+'"]').addEventListener('click',()=>check(x,k+'q'+i))});
  document.querySelectorAll('[data-sol]').forEach(b=>b.addEventListener('click',()=>{const s=document.getElementById(b.dataset.sol);s.hidden=!s.hidden;b.textContent=s.hidden?'Musterlösung zeigen':'Musterlösung verbergen'}));
}
let TEST=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newTest(){
  let pool=[];ORDER.forEach(k=>{pool=pool.concat(shuffle(T[k].ex.map(x=>Object.assign({tp:k},x))).slice(0,k==='t0'?2:3))});
  TEST=shuffle(pool.concat(shuffle(CASES.map(x=>Object.assign({tp:'test'},x))).slice(0,4)));
}
function viewTest(){
  if(!TEST.length)newTest();
  $('#main').innerHTML=`<h2>Lernkontrolle</h2><p class="lead">${TEST.length} gemischte Aufgaben aus allen Themen, dazu Transferaufgaben (Lernziel 10). Löse alle Aufgaben und klicke dann unten auf «Auswerten». Mit «Neue Lernkontrolle» bekommst du andere Aufgaben.</p>
  ${TEST.map((x,i)=>qHtml(x,'tq'+i,i+1)).join('')}
  <div class="row"><button class="btn" id="eval">Auswerten</button><button class="btn sec" id="again">Neue Lernkontrolle</button></div><div id="res"></div>`;
  TEST.forEach((x,i)=>document.querySelector('[data-chk="tq'+i+'"]').addEventListener('click',()=>check(x,'tq'+i)));
  $('#again').addEventListener('click',()=>{newTest();viewTest();window.scrollTo(0,0)});
  $('#eval').addEventListener('click',()=>{
    let n=0,miss={},open=0;TEST.forEach((x,i)=>{const r=check(x,'tq'+i);if(r===true)n++;else{if(r===null)open++;const k=x.tp;miss[k]=(miss[k]||0)+1}});
    const pct=Math.round(n/TEST.length*100);
    const tips=Object.keys(miss).map(k=>'<a class="go" style="display:inline-block;margin:3px;font-size:.85rem;font-weight:600;color:var(--accent-ink);text-decoration:none;padding:4px 9px;border-radius:6px;background:var(--accent-soft)" href="#'+(k==='test'?'t2':k)+'">'+(k==='test'?'Transferaufgaben':(k==='t0'?'':T[k].nr+' ')+T[k].title)+' ('+miss[k]+')</a>').join(' ');
    $('#res').innerHTML='<div class="box" style="margin-top:16px"><div class="score">'+n+' / '+TEST.length+'</div><p style="margin:4px 0 10px">'+(pct>=80?'Sehr gut! Du bist gut vorbereitet.':pct>=60?'Gut! Wiederhole die Themen unten noch einmal.':'Übe die Themen unten nochmals mit Theorie und Übungen.')+(open?' ('+open+' Aufgaben nicht beantwortet.)':'')+'</p>'+(tips?'<div style="font-weight:600;margin-bottom:4px">Noch üben:</div>'+tips:'')+'</div>';
    $('#res').scrollIntoView({behavior:'smooth',block:'start'});
  });
}
function route(){
  let h=(location.hash||'').slice(1);if(!T[h]&&h!=='test')h='lernziele';
  nav(h);if(h==='lernziele')viewStart();else if(h==='test')viewTest();else viewTopic(h);
  $('#side').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');window.scrollTo(0,0);
}
$('#menuBtn').addEventListener('click',()=>{const o=$('#side').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',o)});
window.addEventListener('hashchange',route);route();
</script>
