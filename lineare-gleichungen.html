<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lineare Gleichungen trainieren</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: Kopfband mit Logo rechts, Seitennavigation links (Themen V, 1–4), Inhalt rechts; auf dem Handy Navigation als Klappmenü. Mathe = dunkelblau */
:root{
  --bg:#f1f4fa; --surface:#ffffff; --fg:#141f38; --muted:#56627b; --line:#d5dcea;
  --band:#13285a; --band-fg:#ffffff; --accent:#3a6fd9; --accent-ink:#1d47a3; --accent-soft:#e3ebfb;
  --ok:#2e7d32; --ok-soft:#e5f3e6; --bad:#c62828; --bad-soft:#fbe7e7; --chip:#e6ebf5;
  --sign:#cc1f1f; --sign-in:#ffffff; --sign-ink:#141414;
  --f-head:"Bitter", Georgia, serif; --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --surface:#151e35; --fg:#e4eaf7; --muted:#a0abc3; --line:#27324f;
  --band:#0e1d45; --band-fg:#f1f5fd; --accent:#6f9cff; --accent-ink:#a8c3ff; --accent-soft:#1b2a4f;
  --ok:#7fd483; --ok-soft:#1c3320; --bad:#ff8a80; --bad-soft:#3a1e1e; --chip:#202b47;
  --sign:#e04848; --sign-in:#f4f4f4; --sign-ink:#141414; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --surface:#151e35; --fg:#e4eaf7; --muted:#a0abc3; --line:#27324f;
  --band:#0e1d45; --band-fg:#f1f5fd; --accent:#6f9cff; --accent-ink:#a8c3ff; --accent-soft:#1b2a4f;
  --ok:#7fd483; --ok-soft:#1c3320; --bad:#ff8a80; --bad-soft:#3a1e1e; --chip:#202b47;
  --sign:#e04848; --sign-in:#f4f4f4; --sign-ink:#141414; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
header.top{background:var(--band);color:var(--band-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--f-head);font-size:1.3rem;margin:0;line-height:1.2;text-wrap:balance}
.top .sub{font-size:.8rem;opacity:.85;letter-spacing:.04em}
.top .ttl{flex:1;min-width:0}
.logo{background:#ffffff;border-radius:8px;padding:5px 9px;display:flex;align-items:center;flex-shrink:0}
.logo img{height:30px;width:auto;display:block}
.menu-btn{display:none;background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--band-fg);border-radius:6px;padding:6px 10px;font:inherit;font-size:.9rem;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;padding-block:24px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px 10px;font-weight:700}
.side a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:7px;color:var(--fg);text-decoration:none;font-size:.95rem}
.side a .n{font-size:.75rem;font-weight:700;min-width:30px;height:22px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-variant-numeric:tabular-nums}
.side a:hover{background:var(--chip)}
.side a.on{background:var(--band);color:var(--band-fg)}
.side a.on .n{background:var(--band-fg);color:var(--band)}
main{min-width:0}
main h2{font-family:var(--f-head);font-size:1.75rem;margin:0 0 6px;line-height:1.2;text-wrap:balance;color:var(--fg)}
main h3{font-family:var(--f-head);font-size:1.2rem;margin:0 0 10px}
.lead{color:var(--muted);max-width:68ch;margin:0 0 20px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 18px;border-bottom:2px solid var(--line)}
.tabs button{font:inherit;font-weight:600;background:none;border:none;padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.goalbox{border-left:5px solid var(--accent)}
.theory{max-width:72ch}
.theory p{margin:0 0 12px}
.theory ul,.theory ol{margin:0 0 12px;padding-left:22px}
.theory b{color:var(--accent-ink)}
.formel{font-family:var(--f-head);font-size:1.15rem;background:var(--chip);border-radius:8px;padding:10px 14px;margin:10px 0 14px;display:inline-block}
.merk{background:var(--accent-soft);border-radius:8px;padding:12px 16px;margin:14px 0}
.merk::before{content:"Merke";display:block;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:4px}
.fig{margin:10px 0 16px;overflow-x:auto}
.fig svg{display:block;max-width:100%;height:auto}
.fig .cap{font-size:.85rem;color:var(--muted);margin-top:4px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .ax{stroke:var(--muted);stroke-width:1.5}
svg .ln{stroke:var(--accent-ink);stroke-width:3;fill:none}
svg .tri{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
svg .wedge{fill:var(--accent-soft);stroke:var(--accent-ink);stroke-width:2}
svg .hyp{stroke:var(--accent);stroke-width:3}
svg .pt{fill:var(--accent-ink)}
svg .ln2{stroke:var(--bad);stroke-width:3;fill:none} svg .ln3{stroke:var(--ok);stroke-width:3;fill:none}
svg text.lnt{fill:var(--accent-ink)} svg text.ln2t{fill:var(--bad)} svg text.ln3t{fill:var(--ok)}
.q .fig{margin:6px 0 10px}
svg text{fill:var(--fg);font-family:var(--f-body);font-size:14px}
svg text.s{fill:var(--muted);font-size:12px}
svg .sgn{fill:var(--sign)} svg .sgi{fill:var(--sign-in)} svg .sgk{fill:var(--sign-ink)}
svg text.sgt{fill:var(--sign-ink);font-weight:700;font-size:30px}
.tblwrap{overflow-x:auto;margin:10px 0 14px}
table.t{border-collapse:collapse;min-width:420px;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--chip)}
.lv{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lv span{font-size:.85rem;background:var(--chip);border-radius:6px;padding:3px 9px}
.lvh{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.goal{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.goal input{width:20px;height:20px;margin-top:3px;accent-color:var(--accent-ink);flex-shrink:0}
.goal .txt{flex:1;min-width:0}
.goal .meta{font-size:.8rem;color:var(--muted)}
.goal a.go{font-size:.85rem;font-weight:600;color:var(--accent-ink);text-decoration:none;white-space:nowrap;padding:4px 9px;border-radius:6px;background:var(--accent-soft)}
.goals{display:flex;flex-direction:column;gap:8px}
.stars{color:var(--accent-ink);font-weight:700;letter-spacing:1px}
.prog{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.prog div{height:100%;background:var(--accent);width:0;transition:width .3s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.q .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--muted)}
.tag.b{background:var(--accent-soft);color:var(--accent-ink)}
.q .qt{font-weight:600;margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.opt input{margin-top:4px;accent-color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.numrow{display:flex;gap:8px;align-items:center}
.numrow input{font:inherit;width:9em;max-width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-variant-numeric:tabular-nums}
.numrow input.ok{border-color:var(--ok);background:var(--ok-soft)}
.numrow input.bad{border-color:var(--bad);background:var(--bad-soft)}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 12px;align-items:center}
.match select{font:inherit;font-size:.95rem;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.match select.ok{border-color:var(--ok);background:var(--ok-soft)}
.match select.bad{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.btn{font:inherit;font-weight:600;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;background:var(--band);color:var(--band-fg)}
.btn.sec{background:var(--chip);color:var(--fg)}
.btn:focus-visible,.side a:focus-visible,.tabs button:focus-visible,.goal a.go:focus-visible,.numrow input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.fb{margin-top:10px;padding:9px 12px;border-radius:7px;font-size:.95rem}
.fb.ok{background:var(--ok-soft);color:var(--fg);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--fg);border-left:4px solid var(--bad)}
.write textarea{width:100%;min-height:90px;font:inherit;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.sol{margin-top:10px;background:var(--accent-soft);border-radius:8px;padding:10px 14px}
.score{font-family:var(--f-head);font-size:2.2rem;font-variant-numeric:tabular-nums}
.foot{font-size:.82rem;color:var(--muted);margin-top:28px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--fg);display:flex;flex-direction:column;gap:4px}
.card:hover{border-color:var(--accent)}
.card .n{font-size:.8rem;color:var(--accent-ink);font-weight:700}
.card b{font-family:var(--f-head)}
.card .m{font-size:.82rem;color:var(--muted)}
@media (max-width:820px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:16px}
  .menu-btn{display:inline-block}
  nav.side{position:static;display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
  nav.side.open{display:flex}
  .top h1{font-size:1.05rem}
  .logo img{height:24px}
  .match{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- Grafiken ---------- */
function ks(o){
  const u=34,p=26,{xmin,xmax,ymin,ymax}=o;
  const X=x=>p+(x-xmin)*u, Y=y=>p+(ymax-y)*u, W=X(xmax)+p, H=Y(ymin)+p;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="'+o.label+'">';
  for(let x=xmin;x<=xmax;x++)s+='<line class="grid" x1="'+X(x)+'" y1="'+Y(ymin)+'" x2="'+X(x)+'" y2="'+Y(ymax)+'"/>';
  for(let y=ymin;y<=ymax;y++)s+='<line class="grid" x1="'+X(xmin)+'" y1="'+Y(y)+'" x2="'+X(xmax)+'" y2="'+Y(y)+'"/>';
  s+='<line class="ax" x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'"/><line class="ax" x1="'+X(0)+'" y1="'+Y(ymin)+'" x2="'+X(0)+'" y2="'+Y(ymax)+'"/>';
  s+='<text x="'+(X(xmax)-4)+'" y="'+(Y(0)-6)+'" text-anchor="end">x</text><text x="'+(X(0)+6)+'" y="'+(Y(ymax)+12)+'">y</text>';
  for(let x=xmin;x<xmax;x++)if(x)s+='<text class="s" x="'+X(x)+'" y="'+(Y(0)+15)+'" text-anchor="middle">'+String(x).replace('-','−')+'</text>';
  for(let y=ymin;y<ymax;y++)if(y)s+='<text class="s" x="'+(X(0)-6)+'" y="'+(Y(y)+4)+'" text-anchor="end">'+String(y).replace('-','−')+'</text>';
  const [m,q]=o.line,[x0,dx]=o.tri,y0=m*x0+q,y1=y0+m*dx;
  s+='<polygon class="tri" points="'+X(x0)+','+Y(y0)+' '+X(x0+dx)+','+Y(y0)+' '+X(x0+dx)+','+Y(y1)+'"/>';
  s+='<line class="ln" x1="'+X(xmin)+'" y1="'+Y(m*xmin+q)+'" x2="'+X(xmax)+'" y2="'+Y(m*xmax+q)+'"/>';
  s+='<text x="'+X(x0+dx/2)+'" y="'+(Y(y0)+(m>0?18:-8))+'" text-anchor="middle">'+dx+' nach rechts</text>';
  s+='<text x="'+(X(x0+dx)+6)+'" y="'+(Y((y0+y1)/2)+5)+'">'+Math.abs(m*dx)+(m>0?' nach oben':' nach unten')+'</text>';
  s+='<circle class="pt" cx="'+X(0)+'" cy="'+Y(q)+'" r="5"/>';
  s+='<text x="'+(X(xmax)-6)+'" y="'+(Y(m*xmax+q)+(m>0?22:-10))+'" text-anchor="end" style="font-weight:700">'+o.eq+'</text>';
  return s+'</svg>';
}

/* ---------- Grafik: Koordinatensystem für lineare Gleichungen ---------- */
function kesc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function KS(o){
  const u=o.u||30,p=24,xmin=o.xmin??-5,xmax=o.xmax??6,ymin=o.ymin??-5,ymax=o.ymax??6;
  const X=x=>p+(x-xmin)*u, Y=y=>p+(ymax-y)*u, W=X(xmax)+p, H=Y(ymin)+p;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" role="img" aria-label="'+kesc(o.label||'Koordinatensystem')+'">';
  for(let x=xmin;x<=xmax;x++)s+='<line class="grid" x1="'+X(x)+'" y1="'+Y(ymin)+'" x2="'+X(x)+'" y2="'+Y(ymax)+'"/>';
  for(let y=ymin;y<=ymax;y++)s+='<line class="grid" x1="'+X(xmin)+'" y1="'+Y(y)+'" x2="'+X(xmax)+'" y2="'+Y(y)+'"/>';
  s+='<line class="ax" x1="'+X(xmin)+'" y1="'+Y(0)+'" x2="'+X(xmax)+'" y2="'+Y(0)+'"/><line class="ax" x1="'+X(0)+'" y1="'+Y(ymin)+'" x2="'+X(0)+'" y2="'+Y(ymax)+'"/>';
  s+='<text x="'+(X(xmax)-4)+'" y="'+(Y(0)-6)+'" text-anchor="end">x</text><text x="'+(X(0)+6)+'" y="'+(Y(ymax)+12)+'">y</text>';
  for(let x=xmin;x<xmax;x++)if(x)s+='<text class="s" x="'+X(x)+'" y="'+(Y(0)+14)+'" text-anchor="middle">'+String(x).replace('-','−')+'</text>';
  for(let y=ymin;y<ymax;y++)if(y)s+='<text class="s" x="'+(X(0)-5)+'" y="'+(Y(y)+4)+'" text-anchor="end">'+String(y).replace('-','−')+'</text>';
  if(o.tri){const t=o.tri,y0=t.m*t.x0+t.q,y1=y0+t.m*t.dx;
    s+='<polygon class="tri" points="'+X(t.x0)+','+Y(y0)+' '+X(t.x0+t.dx)+','+Y(y0)+' '+X(t.x0+t.dx)+','+Y(y1)+'"/>';
    s+='<text x="'+X(t.x0+t.dx/2)+'" y="'+(Y(y0)+(t.m>0?16:-6))+'" text-anchor="middle" class="s">'+t.dx+' nach rechts</text>';
    s+='<text x="'+(X(t.x0+t.dx)+5)+'" y="'+(Y((y0+y1)/2)+4)+'" class="s">'+F(Math.abs(t.m*t.dx))+(t.m>0?' nach oben':' nach unten')+'</text>';}
  (o.lines||[]).forEach((L,i)=>{
    // auf Rahmen zuschneiden
    const pts=[];[xmin,xmax].forEach(x=>{const y=L.m*x+L.q;if(y>=ymin-1e-9&&y<=ymax+1e-9)pts.push([x,y])});
    if(L.m){[ymin,ymax].forEach(y=>{const x=(y-L.q)/L.m;if(x>=xmin&&x<=xmax)pts.push([x,y])})}
    pts.sort((a,b)=>a[0]-b[0]);if(pts.length<2)return;const a=pts[0],b=pts[pts.length-1];
    s+='<line class="'+(L.cls||'ln')+'" x1="'+X(a[0])+'" y1="'+Y(a[1])+'" x2="'+X(b[0])+'" y2="'+Y(b[1])+'"/>';
    if(L.label)s+='<text x="'+(X(b[0])-6)+'" y="'+(Y(b[1])+(L.m>0?18:-8))+'" text-anchor="end" style="font-weight:700" class="'+(L.cls||'ln')+'t">'+kesc(L.label)+'</text>';
  });
  (o.pts||[]).forEach(([x,y,n])=>{s+='<circle class="pt" cx="'+X(x)+'" cy="'+Y(y)+'" r="4.5"/>'+(n?'<text x="'+(X(x)+6)+'" y="'+(Y(y)-6)+'" style="font-weight:700">'+kesc(n)+'</text>':'')});
  return s+'</svg>';
}

/* ---------- Aufgabengenerator: neue Zahlen bei jedem Klick ---------- */
let RNG=Math.random;
const R=(a,b)=>a+Math.floor(RNG()*(b-a+1));
const pick=a=>a[Math.floor(RNG()*a.length)];
const r2=n=>Math.round(n*100)/100;
function F(n,dd=2){const f=10**dd;n=Math.round(n*f)/f;const neg=n<0;n=Math.abs(n);let [i,d]=String(n).split('.');if(i.length>3)i=i.replace(/\B(?=(\d{3})+(?!\d))/g,"'");return (neg?'−':'')+i+(d?','+d:'');}
// Steigungen in drei Stufen: natürliche Zahlen, Brüche, negative Zahlen
const MNAT=[[1,1],[2,1],[3,1],[4,1]], MFR=[[1,2],[1,3],[2,3],[3,4],[3,2],[1,4]], MNEG=[[-1,1],[-2,1],[-3,1],[-1,2],[-2,3],[-3,2],[-1,3]];
const mPick=()=>pick(pick([MNAT,MFR,MNEG]));
function mTxt([n,d]){if(d===1)return n===1?'':n===-1?'−':F(n);return (n<0?'−':'')+Math.abs(n)+'/'+d+' '}
function mVal([n,d]){return n/d}
function mShow([n,d]){return d===1?F(n):(n<0?'−':'')+Math.abs(n)+'/'+d}
function eqTxt(m,q){let s='y = '+mTxt(m)+'x';if(m[1]!==1)s='y = '+mTxt(m)+'x';if(q>0)s+=' + '+F(q);if(q<0)s+=' − '+F(-q);return s.replace(/\s+/g,' ')}
function triText(m){const[n,d]=m;return d+' nach rechts, '+Math.abs(n)+(n>0?' nach oben':' nach unten')}
function opts4(correct,cands){const o=[correct];for(const c of cands){if(o.length>=4)break;if(!o.includes(c))o.push(c)}while(o.length<4){const c=eqTxt(mPick(),R(-3,3));if(!o.includes(c))o.push(c)}const sh=shuffle(o);return{o:sh,a:sh.indexOf(correct)}}
function triStart(m,q){// Startpunkt mit ganzzahligen Koordinaten im sichtbaren Bereich
  const [n,d]=m;for(const x0 of [0,-d,d,-2*d,1,-1]){const y0=n/d*x0+q,y1=y0+n;if(Number.isInteger(y0)&&y0>=-5&&y0<=6&&y1>=-5&&y1<=6&&x0+d<=6&&x0>=-5)return x0}return 0}
const GEN={
 read0:()=>{const m=mPick();const c=eqTxt(m,0);const {o,a}=opts4(c,[eqTxt([m[1]*Math.sign(m[0]),Math.abs(m[0])],0),eqTxt([-m[0],m[1]],0),eqTxt(m,1)]);
   return{svg:KS({lines:[{m:mVal(m),q:0}],label:'Ursprungsgerade'}),q:'Welche Gleichung gehört zur Geraden?',o,a,e:'Steigungsdreieck: '+triText(m)+' → m = '+mShow(m)+'. Gleichung: '+c}},
 m0:()=>{const m=pick(pick([MNAT,MFR,MNEG]));const k=pick([1,2]);const x=m[1]*k,y=m[0]*k;return{q:'Eine Ursprungsgerade y = m · x geht durch den Punkt P('+F(x)+'|'+F(y)+'). Wie gross ist m? Runde wenn nötig auf 2 Stellen.',a:r2(mVal(m)),tol:0.006,e:'m = y : x = '+F(y)+' : '+F(x)+' = '+F(mVal(m))+(m[1]>1?' (= '+mShow(m)+')':'')}},
 read1:()=>{const m=mPick();let q=0;while(!q)q=R(-3,4);const c=eqTxt(m,q);const {o,a}=opts4(c,[eqTxt(m,-q),eqTxt([m[1]*Math.sign(m[0]),Math.abs(m[0])],q),eqTxt([-m[0],m[1]],q)]);
   const x0=triStart(m,q);return{svg:KS({lines:[{m:mVal(m),q}],label:'Gerade'}),q:'Welche Gleichung gehört zur Geraden?',o,a,e:'q = '+F(q)+' (Schnittpunkt mit der y-Achse). Steigungsdreieck: '+triText(m)+' → m = '+mShow(m)+'. Gleichung: '+c}},
 mq:()=>{const m=mPick();let q=0;while(!q)q=R(-6,6);const ask=pick(['m','q']);return{q:'Gegeben ist '+eqTxt(m,q)+'. Wie gross ist '+ask+'? Runde wenn nötig auf 2 Stellen.',a:ask==='m'?r2(mVal(m)):q,tol:0.006,e:'In y = m · x + q ist m die Zahl vor dem x ('+mShow(m)+') und q die Zahl am Schluss mit Vorzeichen ('+F(q)+').'}},
 y:()=>{const m=pick([[1,1],[2,1],[3,1],[1,2],[3,2],[-1,1],[-2,1],[-1,2],[1,4]]),q=R(-4,4),x=R(-4,6);const y=mVal(m)*x+q;return{q:'Gerade '+eqTxt(m,q)+': Welchen y-Wert hat der Punkt mit x = '+F(x)+'?',a:r2(y),tol:0.006,e:'y = '+F(mVal(m))+' · '+(x<0?'('+F(x)+')':F(x))+(q?(q>0?' + '+q:' − '+Math.abs(q)):'')+' = '+F(y)}},
 tab:()=>{const m=pick([[1,1],[2,1],[3,1],[-1,1],[-2,1],[1,2],[-1,2],[3,2]]);let q=R(-4,4);const st=m[1];const xs=[0,st,2*st,3*st];const ys=xs.map(x=>mVal(m)*x+q);
   const c=eqTxt(m,q);const {o,a}=opts4(c,[eqTxt(m,ys[1]),eqTxt([-m[0],m[1]],q),eqTxt([ys[1]-q,1],q===0?1:q)]);
   return{table:[xs,ys],q:'Welche Gleichung gehört zu dieser Wertetabelle?',o,a,e:'q = '+F(q)+' (y bei x = 0). y ändert sich um '+F(ys[1]-q)+', wenn x um '+st+' grösser wird → m = '+mShow(m)+'. Gleichung: '+c}},
 on:()=>{const m=pick([[1,1],[2,1],[3,1],[-1,1],[-2,1],[1,2]]);const q=R(-4,4),x=R(-3,5);let y=mVal(m)*x+q;const yes=RNG()<.5;if(!yes)y+=pick([-2,-1,1,2]);const o=['Ja','Nein'];
   return{q:'Liegt der Punkt P('+F(x)+'|'+F(y)+') auf der Geraden '+eqTxt(m,q)+'?',o,a:yes?0:1,e:F(mVal(m))+' · '+(x<0?'('+F(x)+')':F(x))+(q?(q>0?' + '+q:' − '+Math.abs(q)):'')+' = '+F(mVal(m)*x+q)+(yes?' = y → ja.':' ≠ '+F(y)+' → nein.')}},

 vergleich:()=>{const pa=pick([3,4,5]),pb=pa+pick([2,3,5]),x=pick([2,3,4,5,6]);const ga=(pb-pa)*x;return{q:'Angebot A kostet '+ga+' CHF Grundgebühr und '+pa+' CHF pro Stunde. Angebot B kostet '+pb+' CHF pro Stunde ohne Grundgebühr. Bei wie vielen Stunden kosten beide gleich viel?',a:x,u:'h',e:pa+'x + '+ga+' = '+pb+'x → '+ga+' = '+(pb-pa)+'x → x = '+x+' h'}},
 anteil:()=>{const p=pick([10,20,25,30,40,60,75]),n=pick([20,40,60,80,120,200,240]);return{q:p+' % von '+n+' Personen machen mit. Die Gerade lautet y = '+F(p/100)+' · x. Wie viele Personen machen mit?',a:p*n/100,u:'Personen',e:'y = '+F(p/100)+' · '+n+' = '+F(p*n/100)}},
 relativ:()=>{const [a,b]=pick([[9,24],[6,24],[12,48],[15,60],[18,72],[7,28],[45,180],[30,120]]);return{q:a+' von '+b+' Schülerinnen und Schülern machen mit. Wie gross ist der Anteil in Prozent? (Das ist auch die Steigung m der Geraden y = m · x.)',a:r2(a/b*100),tol:0.006,u:'%',e:a+' : '+b+' = '+F(a/b,3)+' = '+F(a/b*100)+' %'}}

  msg(el,ok,x);return ok;

function abTask(k){

  if(k==='table'){const mm=pick([[1,1],[2,1],[3,1],[-1,1],[-2,1],[1,2],[-1,2]]);q=R(-3,3);const xs=mm[1]===2?[-4,-2,0,2,4]:[-2,-1,0,1,2];const ys=xs.map(x=>mVal(mm)*x+q);
    return{text:'Fülle die Wertetabelle für '+eqTxt(mm,q)+' aus.',table:{xs,ys,blank:true},sol:'y: '+ys.map(v=>F(v)).join(' | ')}}
  if(k==='tab2eq'){const mm=pick([[1,1],[2,1],[3,1],[-1,1],[-2,1],[1,2],[-1,2],[3,2]]);q=R(-4,4);const st=mm[1];const xs=[0,st,2*st,3*st];const ys=xs.map(x=>mVal(mm)*x+q);
    return{text:'Bestimme die Gleichung, die zu dieser Wertetabelle gehört.',table:{xs,ys,blank:false},sol:'q = '+F(q)+', m = '+mShow(mm)+' → '+eqTxt(mm,q),lines:2}}
  if(k==='sach'){const g=GEN[pick(['handy','taxi','kerze','vergleich'])]();return{text:g.q,sol:F(g.a)+(g.u?' '+g.u:'')+' ('+g.e+')',lines:3}}
}

function pdfTxt(s){return String(s).replace(/−/g,'-').replace(/≈/g,'~').replace(/→/g,'->').replace(/[’]/g,"'").replace(/…/g,'...').replace(/≠/g,'nicht =').replace(/✓/g,'ok')}
function makeAB(){

  RNG=old;

  const L=20,W=170,BLUE=[19,40,90],GREY=[128,128,128];

    doc.setFillColor(...BLUE); doc.lines([[30,0],[-5,16],[-30,0]],162,6,[1,1],'F',true);
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('MA',172.5,16.5,{align:'center'});
    doc.setTextColor(...GREY);doc.setFontSize(10);doc.text('LU 14 Lineare Gleichungen',L,16);doc.text('Übungsblatt Nr. '+seed,L+77,16);
    doc.setTextColor(0,0,0);doc.setFontSize(14);doc.text(pdfTxt(title),L,25);doc.setDrawColor(0);doc.setLineWidth(0.3);doc.line(L,27,L+W,27);
    doc.setFont('helvetica','normal');doc.setFontSize(10);
  }
  function grid(x,y,w,h){doc.setDrawColor(190,200,215);doc.setLineWidth(0.15);for(let i=0;i<=w;i+=5)doc.line(x+i,y,x+i,y+h);for(let j=0;j<=h;j+=5)doc.line(x,y+j,x+w,y+j);}
  function ksPdf(x,y,lines,col){const u=4.5,s=5;
    doc.setDrawColor(190,200,215);doc.setLineWidth(0.15);for(let i=-s;i<=s;i++){doc.line(x+(i+s)*u,y,x+(i+s)*u,y+2*s*u);doc.line(x,y+(i+s)*u,x+2*s*u,y+(i+s)*u)}
    doc.setDrawColor(60);doc.setLineWidth(0.35);const ox=x+s*u,oy=y+s*u;doc.line(x,oy,x+2*s*u,oy);doc.line(ox,y,ox,y+2*s*u);
    doc.setFontSize(7);doc.setTextColor(90);for(let i=-s+1;i<s;i++){if(i&&i%2===0){doc.text(String(i),ox+i*u,oy+3,{align:'center'});doc.text(String(-i),ox-1,oy+i*u+1,{align:'right'})}}
    doc.text('x',x+2*s*u-1.5,oy-1.2);doc.text('y',ox+1.2,y+2.5);
    (lines||[]).forEach(([m,q])=>{const pts=[];[-s,s].forEach(xx=>{const yy=m*xx+q;if(yy>=-s&&yy<=s)pts.push([xx,yy])});if(m){[-s,s].forEach(yy=>{const xx=(yy-q)/m;if(xx>=-s&&xx<=s)pts.push([xx,yy])})}
      pts.sort((a,b)=>a[0]-b[0]);if(pts.length<2)return;const a=pts[0],b=pts[pts.length-1];doc.setDrawColor(...(col||BLUE));doc.setLineWidth(0.6);doc.line(ox+a[0]*u,oy-a[1]*u,ox+b[0]*u,oy-b[1]*u)});
    doc.setFontSize(10);doc.setTextColor(0);
  }
  function tablePdf(x,y,xs,ys,blank,red){const cw=14,ch=7;doc.setDrawColor(0);doc.setLineWidth(0.25);
    doc.setFillColor(217,217,217);doc.rect(x,y,cw,ch,'F');doc.rect(x,y+ch,cw,ch,'F');
    doc.setFont('helvetica','bold');doc.text('x',x+cw/2,y+4.8,{align:'center'});doc.text('y',x+cw/2,y+ch+4.8,{align:'center'});doc.setFont('helvetica','normal');
    xs.forEach((v,i)=>{const xx=x+cw*(i+1);doc.rect(xx,y,cw,ch);doc.rect(xx,y+ch,cw,ch);doc.text(pdfTxt(F(v)),xx+cw/2,y+4.8,{align:'center'});
      if(!blank||red){if(red)doc.setTextColor(192,0,0);doc.text(pdfTxt(F(ys[i])),xx+cw/2,y+ch+4.8,{align:'center'});doc.setTextColor(0)}});
    doc.rect(x,y,cw,ch);doc.rect(x,y+ch,cw,ch);
  }
  // Höhe je Aufgabe
  tasks.forEach(t=>{t._lines=doc.splitTextToSize(pdfTxt(t.text),W-20);t._need=t._lines.length*4.6+(t.ks?50:t.table?(t.table.blank?20:24):(t.lines?t.lines*5+12:20))+8;if(t.table&&!t.table.blank)t._need+=8});
  const order=[];let rest=tasks.slice(),yy=48;
  while(rest.length){let k=rest.findIndex(t=>yy+t._need<=284);if(k<0){yy=34;k=0}order.push(rest[k]);yy+=rest[k]._need;rest.splice(k,1)}
  head('Übungsblatt: Lineare Gleichungen');
  doc.text('Name: ______________________________',L,35);doc.text('Datum: ________________',L+110,35);
  doc.setFontSize(9);doc.setTextColor(...GREY);doc.text(pdfTxt('Arbeite mit Bleistift und Geodreieck. Zeichne Steigungsdreiecke ein und schreibe deinen Rechenweg auf.'),L,41);doc.setTextColor(0);doc.setFontSize(10);
  let y=48;
  order.forEach((t,i)=>{
    if(y+t._need>284){doc.addPage();head('Übungsblatt: Lineare Gleichungen');y=34}
    doc.setFont('helvetica','bold');doc.text('Aufgabe '+(i+1),L,y);doc.setFont('helvetica','normal');doc.text(t._lines,L+20,y);y+=t._lines.length*4.6+1.5;
    if(t.ks){ksPdf(L+20,y,t.ks.lines);grid(L+75,y,95,45);y+=49}
    else if(t.table){tablePdf(L+20,y,t.table.xs,t.table.ys,t.table.blank);y+=17;if(!t.table.blank){grid(L+20,y,150,10);y+=12;doc.text('Gleichung: ______________________________',L+20,y+4);y+=8}}
    else{grid(L+20,y,150,(t.lines||3)*5);y+=(t.lines||3)*5+2;doc.text('Resultat: ______________________',L+20,y+4);y+=8}
    y+=4;t._nr=i+1;
  });
  if(withSol){doc.addPage();head('Lösungen zum Übungsblatt Nr. '+seed);y=36;
    order.forEach(t=>{const l1=doc.splitTextToSize(pdfTxt(t.sol),W-60);const h=t.solLine||t.ks?40:l1.length*4.6+6;
      if(y+h>285){doc.addPage();head('Lösungen zum Übungsblatt Nr. '+seed);y=36}
      doc.setFont('helvetica','bold');doc.text('Aufgabe '+t._nr+':',L,y);doc.setFont('helvetica','normal');
      if(t.solLine||t.ks){const lines=t.solLine?[t.solLine]:t.ks.lines;doc.text(doc.splitTextToSize(pdfTxt(t.sol),75),L+22,y);
        const sx=L+110,sy=y-3;const u=3.2,s=5;doc.setDrawColor(200,208,222);doc.setLineWidth(0.12);for(let k=-s;k<=s;k++){doc.line(sx+(k+s)*u,sy,sx+(k+s)*u,sy+2*s*u);doc.line(sx,sy+(k+s)*u,sx+2*s*u,sy+(k+s)*u)}
        doc.setDrawColor(60);doc.setLineWidth(0.3);doc.line(sx,sy+s*u,sx+2*s*u,sy+s*u);doc.line(sx+s*u,sy,sx+s*u,sy+2*s*u);
        lines.forEach(([m,q])=>{const pts=[];[-s,s].forEach(xx=>{const yy=m*xx+q;if(yy>=-s&&yy<=s)pts.push([xx,yy])});if(m){[-s,s].forEach(yy=>{const xx=(yy-q)/m;if(xx>=-s&&xx<=s)pts.push([xx,yy])})}pts.sort((a,b)=>a[0]-b[0]);if(pts.length<2)return;const a=pts[0],b=pts[pts.length-1];doc.setDrawColor(192,0,0);doc.setLineWidth(0.5);doc.line(sx+s*u+a[0]*u,sy+s*u-a[1]*u,sx+s*u+b[0]*u,sy+s*u-b[1]*u)});
        y+=38}
      else{doc.text(l1,L+22,y);y+=l1.length*4.6+5}});
    doc.setFontSize(9);doc.setTextColor(...GREY);doc.text(pdfTxt('Vergleiche zuerst deinen Weg, dann das Resultat.'),L,y+4);
  }
  const pages=doc.getNumberOfPages();for(let p=1;p<=pages;p++){doc.setPage(p);doc.setFontSize(8);doc.setTextColor(...GREY);doc.text('Seite '+p+' von '+pages,L+W,290,{align:'right'})}
  const fn='Uebungsblatt_Lineare_Gleichungen_'+seed+'.pdf';
  try{doc.save(fn);msg.textContent='Fertig: '+fn+' (Blatt-Nr. '+seed+')';}catch(e){msg.textContent='Die PDF konnte hier nicht gespeichert werden. Öffne die Lernseite über den Link in LearningView.';}
}
function route(){
  let h=(location.hash||'').slice(1);if(!T[h]&&h!=='test'&&h!=='ab')h='lernziele';
  nav(h);if(h==='lernziele')viewStart();else if(h==='test')viewTest();else if(h==='ab')viewAB();else viewTopic(h);
  $('#side').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');window.scrollTo(0,0);
}
$('#menuBtn').addEventListener('click',()=>{const o=$('#side').classList.toggle('open');$('#menuBtn').setAttribute('aria-expanded',o)});
window.addEventListener('hashchange',route);route();
</script>
